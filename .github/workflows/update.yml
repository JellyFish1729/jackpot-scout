name: Update jackpot race results
on:
  workflow_dispatch:
    inputs:
      backfill_years:
        description: "Years to import (3 for initial load, 0 for daily refresh)"
        required: false
        default: '3'
        type: choice
        options: ['0', '1', '3', '5']
  schedule:
    # 22:20 JST daily (UTC 13:20); previous date is safely completed.
    - cron: '20 13 * * *'
permissions:
  contents: write
concurrency:
  group: jackpot-data-update
  cancel-in-progress: false
jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 55
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Fetch and aggregate
        env:
          BACKFILL: ${{ inputs.backfill_years || '0' }}
        run: python update_data.py --backfill-years "$BACKFILL" --workers 4
      - name: Commit published dataset if changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add site_data.json
          git diff --cached --quiet || (git commit -m "Update historical race dataset" && git push)
